<!DOCTYPE html>
<html lang="en">
{{> head}}

<body class="page-life page-roundup page-roundup--{{roundup.type}}" data-page="life">
  <div class="paper-wash" aria-hidden="true"></div>
  <div class="paper-dot" aria-hidden="true"></div>

  {{> masthead}}

  <div class="zine-content">

    <svg class="reg-mark" style="position:absolute;top:4px;left:6px" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <line x1="0" y1="9" x2="18" y2="9" stroke="currentColor" stroke-width="1.2"/>
      <line x1="9" y1="0" x2="18" y2="18" stroke="currentColor" stroke-width="1.2"/>
    </svg>

    <nav class="thought-breadcrumb" aria-label="Breadcrumb">
      <a href="/life">life</a> / <a href="/life/fitness">fitness</a> / <a href="{{roundup.indexUrl}}">roundups</a> / {{roundup.short}}
    </nav>

    {{> share-button roundup.share}}

    {{#if roundup.isWeek}}{{> rl-week roundup}}{{/if}}
    {{#if roundup.isMonth}}{{> rl-month roundup}}{{/if}}
    {{#if roundup.isYear}}{{> rl-year roundup}}{{/if}}

  </div>

  {{> footer}}

  <div class="paper-grain" aria-hidden="true"></div>
</body>
</html>
