<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MNE4SWQ0L0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-MNE4SWQ0L0');
  </script>

  <!-- Metadata. Generated pages (activity / roundup) override the defaults with
       headTitle, ogImage, ogType, canonical, publishedTime, atomFeed; everything else leaves them unset. -->
  <title>{{#if headTitle}}{{headTitle}}{{else}}James King | {{page}} {{{subpage}}}{{/if}}</title>
  <meta charset="utf-8" />
  <meta name="description" content="{{description}}" />
  <meta name="author" content="James King" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {{#if canonical}}<link rel="canonical" href="{{canonical}}" />{{/if}}

  <!-- Social sharing -->
  {{#if ogType}}<meta property="og:type" content="{{ogType}}" />{{/if}}
  <meta property="og:title" content="{{#if headTitle}}{{headTitle}}{{else}}James King — {{page}} {{{subpage}}}{{/if}}" />
  <meta property="og:site_name" content="jamesking.dev" />
  <meta property="og:description" content="{{description}}" />
  {{#if canonical}}<meta property="og:url" content="{{canonical}}" />{{/if}}
  <meta property="og:image" content="{{#if ogImage}}{{ogImage}}{{else}}https://james.ripixel.co.uk/card_{{page}}.png{{/if}}" />
  {{#if publishedTime}}<meta property="article:published_time" content="{{publishedTime}}" />{{/if}}
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Theme colour (cream) -->
  <meta name="theme-color" content="#F5EFDF" />

  <!-- Favicons -->
  {{> meta}}

  <!-- Indieweb -->
  <link rel="webmention" href="https://webmention.io/james.ripixel.co.uk/webmention" />
  <link rel="pingback" href="https://webmention.io/james.ripixel.co.uk/xmlrpc" />
  <link rel="alternate" type="application/rss+xml" href="/rss.xml" title="James King" />
  {{#if atomFeed}}<link rel="alternate" type="application/atom+xml" href="{{atomFeed}}" title="James King — fitness" />{{/if}}

  <!-- Zine Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;700&family=Special+Elite&family=Familjen+Grotesk:wght@500;700&family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;700&family=Special+Elite&family=Familjen+Grotesk:wght@500;700&family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;700&family=Special+Elite&family=Familjen+Grotesk:wght@500;700&family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- Styles -->
  <link rel="stylesheet" href="/styles.min.{{cacheHash}}.css" />
</head>
