<!-- Context: one of fitnessLife.activities (buildCard) -->
<a class="fit-card fit-card--{{family}} {{typeClass}}" href="{{href}}">
  {{> fitness-picture}}
  <div class="fit-card__inner">
    <div class="fit-card__top">
      <span class="fit-chip fit-card__type"><span aria-hidden="true">{{glyph}}</span> {{typeLabel}}</span>
      <time class="fit-card__date" datetime="{{dateTime}}">{{date}}</time>
    </div>
    <h3 class="fit-card__title">{{title}}</h3>
    {{#if location}}<div class="fit-card__where">🌍 {{location}}</div>{{/if}}
    <dl class="fit-card__stats">
      {{#each stats}}
      <div class="fit-card__stat">
        <dt class="fit-card__label">{{label}}</dt>
        <dd class="fit-card__num">{{value}}{{#if unit}}<small>{{unit}}</small>{{/if}}</dd>
      </div>
      {{/each}}
    </dl>
    <div class="fit-card__foot">
      {{#if prLabel}}<span class="fit-card__pr">{{prLabel}}</span>{{else}}<span class="fit-card__via">via {{source}}</span>{{/if}}
      <span class="fit-card__more">read →</span>
    </div>
  </div>
</a>
