{{!-- HR zones as inline SVG columns with a minutes axis. Context: hrZoneBars() output
     { w, h, total, base, yLabel, yTicks[], bars[] }. --}}
<div class="act-zones-wrap">
  <div class="act-zones__plot">
    <div class="act-zones__yaxis" aria-hidden="true">
      <span class="act-zones__ycap">{{yLabel}}</span>
      <ol>{{#each yTicks}}<li style="top:{{pct}}%">{{label}}</li>{{/each}}</ol>
    </div>
    <svg class="act-zones" viewBox="0 0 {{w}} {{h}}" role="img" aria-label="Minutes per heart-rate zone, Z1 to Z5">
      <line class="act-zones__base" x1="0" x2="{{w}}" y1="{{base}}" y2="{{base}}" vector-effect="non-scaling-stroke"/>
      {{#each bars}}
      <rect x="{{x}}" y="{{y}}" width="{{w}}" height="{{h}}" class="act-zones__bar" style="opacity:{{opacity}}"><title>{{label}} {{name}}: {{minutes}} min · {{pct}}%</title></rect>
      <text x="{{textX}}" y="{{textY}}" text-anchor="middle" class="act-zones__label">{{label}}</text>
      {{#if minutes}}<text x="{{textX}}" y="{{valueY}}" text-anchor="middle" class="act-zones__value">{{minutes}}</text>{{/if}}
      {{/each}}
    </svg>
  </div>
  <ul class="act-zones__legend">
    {{#each bars}}<li><b>{{label}}</b> {{name}}</li>{{/each}}
  </ul>
</div>
