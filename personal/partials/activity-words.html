{{!-- His own words, as a pull quote straight under the hero. Context: `act`. --}}
{{#if description}}
<section class="act-words" aria-label="In his words">
  <div class="act-words__label">in his words</div>
  <blockquote class="act-words__body">{{description}}</blockquote>
  <div class="act-words__by">— {{owner}}</div>
</section>
{{/if}}
