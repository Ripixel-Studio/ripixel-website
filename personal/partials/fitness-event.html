<!-- Context: one of fitnessLife.calendar.nextUp (events.json from the Fitness Events calendar,
     or the hand-written fallback in personal/items/life/fitness.json). Never a past entry. -->
<li class="fit-event fit-event--{{kind}}">
  <div class="fit-event__date">
    <span class="fit-event__day">{{day}}</span>
    <span class="fit-event__month">{{month}}</span>
  </div>
  <div class="fit-event__body">
    <h3 class="fit-event__title"><span aria-hidden="true">{{emoji}}</span> {{title}}</h3>
    <div class="fit-event__meta">
      <span class="stamp fit-event__stamp {{stampClass}}">{{stamp}}</span>
      <time class="fit-event__when" datetime="{{dateTime}}">{{when}}</time>
      {{#if location}}<span class="fit-event__where">· {{location}}</span>{{/if}}
    </div>
    {{#if description}}<p class="fit-event__desc">{{description}}</p>{{/if}}
  </div>
</li>
