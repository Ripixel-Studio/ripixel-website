<!-- Context: lifeSections.games.monitor {lead, row [{name, art, hours, lastLabel, doneLabel, done, on}]} (tasks/media-view.mjs
     monitorView) — a flat-panel monitor on its stand, showing a game launcher's library (no service's branding): the most
     recently played game large, with its hours, when it was last played and how finished it is, and the next few as a
     row of covers. -->
<figure class="monitor" aria-label="On the monitor: {{lead.name}}">
  <div class="monitor__panel">
    <div class="monitor__screen" style="--bg: url('{{lead.art}}')">
      <div class="launcher">
        <span class="launcher__bar" aria-hidden="true"><b>LIBRARY</b><span>recently played</span><i></i><i></i><i></i></span>
        <div class="launcher__hero">
          <img class="launcher__cover" src="{{lead.art}}" alt="" decoding="async" width="600" height="900">
          <div class="launcher__about">
            <strong class="launcher__name">{{lead.name}}</strong>
            {{#if lead.lastLabel}}<span class="launcher__meta">last played <b>{{lead.lastLabel}}</b></span>{{/if}}
            {{#if lead.hours}}<span class="launcher__meta">played <b>{{lead.hours}}</b></span>{{/if}}
            {{#if lead.doneLabel}}<span class="launcher__meta">achievements <b>{{lead.doneLabel}}</b></span><span class="launcher__progress"><span style="width: {{lead.done}}%"></span></span>{{/if}}
            <span class="launcher__play" aria-hidden="true">&#9654; PLAY</span>
          </div>
        </div>
        <ol class="launcher__row" aria-label="Recently played">
          {{#each row}}
          <li class="launcher__tile{{#if on}} launcher__tile--on{{/if}}"><img src="{{art}}" alt="{{name}}" loading="lazy" decoding="async" width="600" height="900"><span>{{name}}</span></li>
          {{/each}}
        </ol>
      </div>
      <span class="monitor__glare" aria-hidden="true"></span>
    </div>
    <span class="monitor__chin" aria-hidden="true"><i></i></span>
  </div>
  <span class="monitor__neck" aria-hidden="true"></span>
  <span class="monitor__foot" aria-hidden="true"></span>
</figure>
