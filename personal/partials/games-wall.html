<!-- Context: lifeSections.games.wall [{name, art, weight, tilt, quip, league, ink}] — the cover wall: a list
     of games, League first, then most played (weighted towards recent play). Weight sets the tile's size,
     tilt its angle; a tile with no art (or whose art fails to load) is the name set in type. The quip is James's own line, as a sticker. -->
<div class="games-wall-wrap">
<ol class="games-wall" aria-label="The games, most played first">
  {{#each this}}
  <li class="games-tile games-tile--w{{weight}}{{#if league}} games-tile--league{{/if}} games-tile--ink{{ink}}{{#unless art}} games-tile--type{{/unless}}" style="--tilt: {{tilt}}deg">
    <figure class="games-tile__figure">
      <span class="games-tile__name"{{#if art}} aria-hidden="true"{{/if}}>{{name}}</span>
      {{#if art}}<img class="games-tile__art" src="{{art}}" alt="{{name}}" loading="lazy" decoding="async" width="600" height="900">{{/if}}
      {{#if league}}<span class="games-tile__badge">most played, by far</span>{{/if}}
      {{#if quip}}<figcaption class="games-tile__quip">“{{quip}}”</figcaption>{{/if}}
    </figure>
  </li>
  {{/each}}
</ol>
</div>
