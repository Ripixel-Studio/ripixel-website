<!-- Context: lifePersonal [{key, label, value, tone}] — the personal bits, from public facts only -->
<section class="life-personal" aria-labelledby="life-personal-title">
  <h2 class="life-personal__title" id="life-personal-title">the small print.</h2>
  <dl class="life-personal__list">
    {{#each this}}
    <div class="life-personal__row life-personal__row--{{tone}}">
      <dt>{{label}}</dt>
      <dd>{{value}}</dd>
    </div>
    {{/each}}
  </dl>
</section>
